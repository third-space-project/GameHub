  <!doctype html>
  <html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>GAMEHUB</title>
        <link rel="stylesheet" href="web/assets/styles/home.css">
        

        <link href="https://fonts.googleapis.com/css?family=Press+Start+2P" rel="stylesheet">
        

    

        <script src="web/script.js" defer></script>
    </head>

    <body>
        <div class="top-box">
            <header>
                <h1 class="app-title" >ARC8D v0.1</h1>
            </header>
            <i class="nes-logo"></i>
            <div class="search-wrapper">
                <input type="text"  id="search" class="search" placeholder="BROWSE">
                <button class="clear-btn" id="clear">x</button>
            </div>
        </div>

        <div class="bottom-box">
            <div style="margin: 0 auto; width: 15%;">
                <button type="button" id="start-btn" class="nes-btn is-error" disabled>START!</button>
                <div style="margin: 0 ; size: 64px 64px; position: absolute; right: 1%; bottom: 7%;" >
                        <a href="https://github.com/third-space-project/GameHub">
                            <i class="nes-icon github is-medium" ></i>
                        </a>
                </div>
            </div>
        </div>

        <div class="loading-screen" id="loading-screen" aria-live="polite" aria-hidden="true">
            <div class="loading-coin-wrap">
                <div class="gold-coin" aria-hidden="true">
                    <i class="nes-icon coin is-large"></i>
                </div>
            </div>
            <p class="loading-text">INSERTING COIN...</p>
        </div>

        <main>

            <div class="grid" id="grid"></div>
            <p class="empty" id="empty">NO GAMES FOUND</p>
        
        </main>
  
    </body>
  </html>
